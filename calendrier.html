<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calendrier · 3SI1 &amp; 4SI2 — Devoirs</title>
  <meta name="description" content="Calendrier des échéances des classes 3ème SI 1 et 4ème SI 2 — matière STI." />
  <link rel="icon" type="image/png" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#f43f5e" />
  <script>(function(){var t=localStorage.getItem('theme');if(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)t='dark';if(t)document.documentElement.dataset.theme=t;})()</script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="calendrier">

  <section class="page-hero">
    <div class="blob blob-1"></div>
    <div class="container">
      <h1>🗓️ Calendrier des échéances</h1>
      <p class="sub">Toutes les dates limites des devoirs, au même endroit. Cliquez sur une échéance pour voir le devoir.</p>
    </div>
  </section>

  <main>
    <section class="section">
      <div class="container">
        <div class="cal-nav mb-2">
          <button class="btn btn-outline btn-sm" id="cal-prev">← Précédent</button>
          <h3 id="cal-titre">—</h3>
          <button class="btn btn-outline btn-sm" id="cal-next">Suivant →</button>
          <div style="margin-left:auto; display:flex; gap:.75rem; flex-wrap:wrap">
            <span class="pill" style="border-color:var(--rose);background:var(--soft-rose);color:var(--rose)">● 3ème SI 1</span>
            <span class="pill" style="border-color:var(--cyan);background:var(--soft-cyan);color:#0e7490">● 4ème SI 2</span>
          </div>
        </div>

        <div class="cal-grid" id="cal-grid"></div>
      </div>
    </section>

    <section class="section-tight">
      <div class="container">
        <div class="section-head">
          <div>
            <h2>📌 Prochaines échéances</h2>
            <p>Les dates limites à venir, les plus proches en premier.</p>
          </div>
          <a class="btn btn-secondary btn-sm" href="devoirs.html">Voir les devoirs</a>
        </div>
        <div id="cal-liste"></div>
      </div>
    </section>
  </main>

  <script src="data/config.js"></script>
  <script src="data/devoirs.js"></script>
  <script src="data/eleves.js"></script>
  <script src="data/notes.js"></script>
  <script src="data/annonces.js"></script>
  <script src="data/vie.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
