<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Devoirs · 3SI1 &amp; 4SI2 — STI 2026-2027</title>
  <meta name="description" content="Liste complète des devoirs des classes 3ème SI 1 et 4ème SI 2, filtrable par classe et par statut." />
  <link rel="icon" type="image/png" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#f43f5e" />
  <script>(function(){var t=localStorage.getItem('theme');if(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)t='dark';if(t)document.documentElement.dataset.theme=t;})()</script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="devoirs">

  <section class="page-hero">
    <div class="blob blob-1"></div>
    <div class="container">
      <h1>📋 Tous les devoirs</h1>
      <p class="sub">Filtrez par classe, par statut ou recherchez un mot-clé pour retrouver rapidement un devoir.</p>
    </div>
  </section>

  <main>
    <section class="section">
      <div class="container">
        <div class="filters">
          <div class="field">
            <label for="filtre-classe">Classe</label>
            <select id="filtre-classe"></select>
          </div>
          <div class="field">
            <label for="filtre-statut">Statut</label>
            <select id="filtre-statut">
              <option value="">Tous les statuts</option>
              <option value="afaire">À faire</option>
              <option value="attente">En attente de correction</option>
              <option value="corrigé">Corrigé</option>
            </select>
          </div>
          <div class="field" style="flex: 2">
            <label for="filtre-q">Recherche</label>
            <input type="search" id="filtre-q" placeholder="Ex. : Python, projet, HTML…" />
          </div>
        </div>

        <div id="liste-devoirs"></div>
      </div>
    </section>
  </main>

  <script src="data/config.js"></script>
  <script src="data/devoirs.js"></script>
  <script src="data/eleves.js"></script>
  <script src="data/notes.js"></script>
  <script src="data/annonces.js"></script>
  <script src="data/vie.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
